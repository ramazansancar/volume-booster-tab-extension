<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Volume Booster Tab</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <div class="site">
          <span class="site__label" data-i18n="popupCurrentSite">Current tab</span>
          <span class="site__origin" id="origin">&mdash;</span>
        </div>
        <!--
          The pill reads as a state, not an action: it says whether processing
          is currently on, and clicking it flips that. A label that named the
          action instead ("Bypass") left the user unable to tell, at a glance,
          which of the two states they were actually in.
        -->
        <div class="header-actions">
          <button
            type="button"
            id="bypass"
            class="toggle-pill"
            aria-pressed="false"
            data-i18n-title="popupBypassTitle"
            title="Turn processing off and pass the audio through untouched"
          >
            <span id="bypass-label" data-i18n="popupStateActive">Active</span>
          </button>
          <!-- Hidden by the script when this page is already the detached
               window, where the button would do nothing useful. -->
          <button
            type="button"
            class="icon-button icon-button--quiet"
            id="detach"
            data-i18n-title="popupDetach"
            data-i18n-label="popupDetach"
            title="Open in a separate window"
            hidden
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M14 4h6v6M20 4l-8.5 8.5M18 14.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4.5"
              />
            </svg>
          </button>
        </div>
      </header>

      <section class="control control--primary">
        <div class="control__row">
          <label class="control__label" for="gain" data-i18n="popupVolume">Volume</label>
          <output class="control__value" id="gain-value" for="gain">100%</output>
        </div>
        <input
          type="range"
          id="gain"
          min="0"
          max="600"
          step="5"
          value="100"
          list="gain-ticks"
          aria-describedby="gain-hint"
        />
        <datalist id="gain-ticks">
          <option value="100"></option>
          <option value="200"></option>
          <option value="400"></option>
          <option value="600"></option>
        </datalist>
        <!-- Filled in from the configured ceiling, so raising the maximum in
             settings offers the higher steps here too. -->
        <div class="presets" id="presets" role="group" aria-label="Volume presets"></div>
        <p class="hint" id="gain-hint" data-i18n="popupGainHint">
          Above 100% the limiter stays on to prevent distortion.
        </p>
      </section>

      <section class="control">
        <div class="control__row">
          <label class="control__label" for="balance" data-i18n="popupBalance">Balance</label>
          <output class="control__value" id="balance-value" for="balance">Center</output>
        </div>
        <div class="balance">
          <span class="balance__end" data-i18n="popupBalanceLeft">Left</span>
          <input type="range" id="balance" min="-100" max="100" step="5" value="0" />
          <span class="balance__end" data-i18n="popupBalanceRight">Right</span>
        </div>
      </section>

      <section class="switches">
        <label class="switch">
          <input type="checkbox" id="mono" />
          <span data-i18n="popupMono">Mono</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="limiter" checked />
          <span data-i18n="popupLimiter">Limiter</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="remember" />
          <span data-i18n="popupRemember">Remember this site</span>
        </label>
      </section>

      <!--
        Tabs currently carrying audio. A disclosure rather than a permanent
        list: most of the time there is one tab playing and the user is looking
        at it, so the count in the summary is the whole answer and the rows
        underneath are only worth the space when they want to jump somewhere.
      -->
      <details class="tablist" id="tablist" hidden>
        <summary class="tablist__summary">
          <span data-i18n="popupPlayingTabs">Tabs playing audio</span>
          <span class="tablist__count" id="tablist-count">0</span>
        </summary>
        <ul class="tablist__items" id="tablist-items"></ul>
      </details>

      <!-- Presets sit outside Advanced: picking a named curve is the way most
           people will ever touch the equalizer, and burying it behind a
           disclosure would leave the six sliders as the only visible option. -->
      <section class="preset-row">
        <label class="control__label" for="preset" data-i18n="popupPreset">Preset</label>
        <select id="preset" class="preset-select"></select>
        <button
          type="button"
          class="icon-button"
          id="save-preset"
          data-i18n-title="popupSavePreset"
          data-i18n-label="popupSavePreset"
          title="Save current as preset"
        >
          +
        </button>
      </section>

      <details class="advanced" id="advanced">
        <summary class="advanced__summary">
          <span data-i18n="popupAdvanced">Advanced settings</span>
          <span class="advanced__badge" id="eq-badge" hidden data-i18n="popupEqOn">EQ on</span>
        </summary>

        <div class="advanced__body">
          <!-- Three controls first, six after. Bass/mid/treble is what most
               people mean by "equalizer", and it writes the same six bands, so
               the pair below is a finer view of one setting rather than a
               second, competing one. -->
          <div class="control__row">
            <span class="control__label" data-i18n="popupTone">Tone</span>
            <button type="button" class="link-button" id="eq-reset" data-i18n="popupEqReset">
              Reset
            </button>
          </div>
          <div class="tone" id="tone"></div>

          <div class="control__row control__row--section">
            <span class="control__label" data-i18n="popupProSection">Per-band equalizer</span>
          </div>
          <p class="hint" data-i18n="popupToneHint">
            Three controls over the six bands below.
          </p>
          <div class="equalizer" id="equalizer"></div>
        </div>
      </details>

      <footer class="panel__footer">
        <div class="status-block">
          <p class="status" id="status" role="status"></p>
          <p class="status-detail" id="status-detail" hidden></p>
          <!-- Only shown when the normal path has failed and the browser can
               actually capture the tab, so it never advertises a fallback that
               would do nothing. -->
          <button
            type="button"
            class="link-button link-button--accent"
            id="use-capture"
            data-i18n="popupUseCapture"
            hidden
          >
            Try tab capture
          </button>
        </div>
        <div class="reset-group">
          <button
            type="button"
            class="link-button"
            id="reset-defaults"
            data-i18n="popupResetDefaults"
            data-i18n-title="popupResetDefaultsTitle"
          >
            Use my defaults
          </button>
          <button
            type="button"
            class="link-button"
            id="reset"
            data-i18n="popupResetNeutral"
            data-i18n-title="popupResetNeutralTitle"
          >
            Reset to neutral
          </button>
        </div>
      </footer>

      <!--
        The bottom row: settings, the rating stars, and help.

        Settings and help are icons because each is a single, well-known action
        that a glyph names as well as a word does - and the row has to hold the
        stars too, which need the horizontal space more. Both keep their text as
        an accessible name and a tooltip, so nothing is lost to someone using a
        screen reader or hovering to check.

        The stars are a rating control only in the sense that they open the
        store's own review form: we cannot submit a rating on the user's behalf,
        and pretending otherwise would be a dark pattern. Every star goes to the
        same place, and its accessible name says so. On a build whose store has
        no listing, the script drops the stars and leaves the two icons.
      -->
      <section class="feedback" id="feedback" hidden>
        <button
          type="button"
          class="icon-button icon-button--quiet"
          id="options-link"
          data-i18n-title="popupOpenOptions"
          data-i18n-label="popupOpenOptions"
          title="Open all settings"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              fill="currentColor"
              d="M12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5Zm7.4-2.2a7.6 7.6 0 0 0 0-2.6l2-1.6a.5.5 0 0 0 .1-.6l-1.9-3.2a.5.5 0 0 0-.6-.2l-2.3 1a7.4 7.4 0 0 0-2.2-1.3l-.4-2.4a.5.5 0 0 0-.5-.4h-3.8a.5.5 0 0 0-.5.4l-.4 2.4a7.4 7.4 0 0 0-2.2 1.3l-2.3-1a.5.5 0 0 0-.6.2L2.5 8.5a.5.5 0 0 0 .1.6l2 1.6a7.6 7.6 0 0 0 0 2.6l-2 1.6a.5.5 0 0 0-.1.6l1.9 3.2a.5.5 0 0 0 .6.2l2.3-1a7.4 7.4 0 0 0 2.2 1.3l.4 2.4a.5.5 0 0 0 .5.4h3.8a.5.5 0 0 0 .5-.4l.4-2.4a7.4 7.4 0 0 0 2.2-1.3l2.3 1a.5.5 0 0 0 .6-.2l1.9-3.2a.5.5 0 0 0-.1-.6Z"
            />
          </svg>
        </button>

        <div class="feedback__rate">
          <span class="feedback__prompt" data-i18n="popupEnjoying">Enjoying the boost?</span>
          <div class="stars" id="stars" role="group"></div>
        </div>

        <button
          type="button"
          class="icon-button icon-button--quiet"
          id="support-link"
          data-i18n-title="popupSupport"
          data-i18n-label="popupSupport"
          title="Get help"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              d="M9.1 9a3 3 0 1 1 4 2.8c-.7.3-1.1 1-1.1 1.7v.7"
            />
            <circle cx="12" cy="17.6" r="1.2" fill="currentColor" />
            <circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.6" />
          </svg>
        </button>
      </section>
    </main>

    <script type="module" src="./popup.js"></script>
  </body>
</html>
